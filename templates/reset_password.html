<!DOCTYPE html>
<html lang="en" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · PocketPal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center text-[#37352f] px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight">PocketPal</h1>
            <p class="text-neutral-500 text-sm mt-2">Choose a new password for your account.</p>
        </div>

        <div class="rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
            <h2 class="text-lg font-semibold mb-6">Reset Password</h2>

            <form action="{{ url_for('reset_password', token=token) }}" method="post" class="space-y-4">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="text-xs p-3 rounded-xl {% if category == 'error' %}bg-red-50 text-red-600 border-red-100{% else %}bg-green-50 text-green-600 border-green-100{% endif %} border">
                        {{ message }}
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <div>
                    <label class="block text-xs font-medium text-neutral-600 mb-1">New Password</label>
                    <input type="password" name="password" placeholder="••••••••" required
                           class="w-full rounded-xl bg-neutral-50 border border-neutral-200 px-3 py-2 text-black outline-none focus:border-black transition-all">
                </div>

                <div>
                    <label class="block text-xs font-medium text-neutral-600 mb-1">Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="••••••••" required
                           class="w-full rounded-xl bg-neutral-50 border border-neutral-200 px-3 py-2 text-black outline-none focus:border-black transition-all">
                </div>

                <button type="submit"
                        class="w-full rounded-xl bg-black text-white px-4 py-2 hover:bg-neutral-800 transition-colors font-semibold mt-2">
                    Reset Password
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-neutral-500">
                <a href="{{ url_for('login') }}" class="text-black font-medium hover:underline">Back to login</a>
            </div>
        </div>
    </div>
</body>
</html>
