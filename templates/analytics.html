<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analytics · PocketPal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { brand: { DEFAULT: "#000000" } } } },
      };
    </script>
  </head>
  <body class="h-full bg-white text-[#37352f]">

    <nav class="border-b border-neutral-100 py-4 bg-white/80 backdrop-blur-md sticky top-0 z-50">
      <div class="mx-auto max-w-6xl px-4 flex justify-between items-center">
        <div class="flex items-center gap-6">
          <a href="{{ url_for('index') }}" class="font-bold text-lg tracking-tight">PocketPal</a>
          <div class="flex gap-4">
            <a href="{{ url_for('index') }}"
              class="flex items-center gap-2 text-sm font-medium text-neutral-400 hover:text-black transition-colors">
              Dashboard
            </a>
            <a href="{{ url_for('analytics') }}"
              class="flex items-center gap-2 text-sm font-medium text-black underline underline-offset-8 decoration-2">
              Analytics
            </a>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <span class="text-sm font-medium text-neutral-600">Hi, {{ session.username }}</span>

          <!-- Profile dropdown -->
          <div class="relative">
            <button id="profile-btn" onclick="document.getElementById('profile-menu').classList.toggle('hidden')"
              class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center text-sm font-bold hover:bg-neutral-800 transition-colors focus:outline-none overflow-hidden">
              {% if current_user_pic %}
                <img src="{{ current_user_pic }}" class="w-full h-full object-cover">
              {% else %}
                {{ session['username'][0].upper() }}
              {% endif %}
            </button>

            <div id="profile-menu"
              class="hidden absolute right-0 mt-2 w-44 bg-white border border-neutral-200 rounded-xl shadow-lg z-50 py-1">
              <a href="{{ url_for('profile') }}"
                class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-50 transition-colors">
                Edit Profile
              </a>
              <div class="border-t border-neutral-100 my-1"></div>
              <a href="{{ url_for('logout') }}"
                class="block px-4 py-2 text-sm text-red-500 hover:bg-red-50 transition-colors">
                Logout
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <main class="mx-auto max-w-6xl px-4 py-12">
      <header class="mb-10">
        <h1 class="text-4xl font-bold tracking-tight mb-2">Spending Analytics</h1>
        <p class="text-neutral-500 text-lg">Deep dive into your spending patterns and habits</p>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        <div class="rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
          <h2 class="text-xs font-semibold uppercase tracking-[0.15em] text-neutral-400 mb-6">Category Distribution</h2>
          <p class="text-neutral-500 text-lg"><small>Breakdown of spending by category</small></p>
          <div class="h-[350px]">
            <canvas id="catChart"></canvas>
          </div>
        </div>

        <div class="rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
          <h3 class="text-xs font-semibold uppercase tracking-[0.15em] text-neutral-400 mb-6">Spending Trends</h3>
          <p class="text-neutral-500 text-lg"><small>Monthly expenditure over time</small></p>
          <div class="h-[350px]">
            <canvas id="dayChart"></canvas>
          </div>
        </div>

      </div>

      <div class="mt-12 text-center">
        <a href="{{ url_for('index') }}" class="text-sm font-medium text-neutral-400 hover:text-black transition-colors">
          &larr; Return to detailed list
        </a>
      </div>
    </main>

    <script>
      const catLabels = JSON.parse('{{ categories|tojson | safe }}');
      const catData = JSON.parse('{{ category_totals|tojson | safe }}');
      const dailyLabels = JSON.parse('{{ dates|tojson | safe }}');
      const dailyData = JSON.parse('{{ daily_totals|tojson | safe }}');

      const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: {
            beginAtZero: true,
            grid: { color: '#f5f5f5', drawBorder: false },
            ticks: { color: '#a3a3a3', padding: 10 }
          },
          x: {
            grid: { display: false },
            ticks: { color: '#a3a3a3', padding: 10 }
          }
        }
      };

      new Chart(document.getElementById('catChart'), {
        type: 'bar',
        data: {
          labels: catLabels,
          datasets: [{
            data: catData,
            backgroundColor: '#171717',
            hoverBackgroundColor: '#000000',
            borderRadius: 8,
            barThickness: 40
          }]
        },
        options: commonOptions
      });

      new Chart(document.getElementById('dayChart'), {
        type: 'line',
        data: {
          labels: dailyLabels,
          datasets: [{
            data: dailyData,
            borderColor: '#000000',
            borderWidth: 2.5,
            pointBackgroundColor: '#ffffff',
            pointBorderColor: '#000000',
            tension: 0.35,
            fill: true,
            backgroundColor: 'rgba(0, 0, 0, 0.02)'
          }]
        },
        options: commonOptions
      });

      // Close dropdown when clicking outside
      document.addEventListener('click', function (e) {
        const btn = document.getElementById('profile-btn');
        const menu = document.getElementById('profile-menu');
        if (!btn.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.add('hidden');
        }
      });
    </script>
  </body>
</html>
