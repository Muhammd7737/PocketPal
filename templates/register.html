<!DOCTYPE html>
<html lang="en" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · PocketPal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center text-[#37352f] px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight">Create Account</h1>
            <p class="text-neutral-500 text-sm mt-2">Join PocketPal to start managing your budget.</p>

            <div class="relative my-4">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-neutral-200"></div>
                </div>
                <div class="relative flex justify-center text-xs text-neutral-400">
                    <span class="bg-white px-2">or</span>
                </div>
            </div>
            
            <a href="{{ url_for('google_login') }}"
                class="flex items-center justify-center gap-2 w-full rounded-xl border border-neutral-200 bg-white px-4 py-2 text-sm font-medium hover:bg-neutral-50 transition-colors">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4">
                Continue with Google
            </a>

        </div>

        <div class="rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
            <form action="{{ url_for('register') }}" method="post" class="space-y-4">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="text-xs p-3 rounded-xl {% if category == 'error' %}bg-red-50 text-red-600 border-red-100{% else %}bg-green-50 text-green-600 border-green-100{% endif %} border">
                        {{ message }}
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <div>
                    <label class="block text-xs font-medium text-neutral-600 mb-1">Username</label>
                    <input type="text" name="username" placeholder="choose_username" required
                           class="w-full rounded-xl bg-neutral-50 border border-neutral-200 px-3 py-2 text-black outline-none focus:border-black transition-all">
                </div>

                <div>
                    <label class="block text-xs font-medium text-neutral-600 mb-1">Email <span class="text-neutral-400">(optional —
                            needed for password reset)</span></label>
                    <input type="email" name="email" placeholder="you@email.com"
                        class="w-full rounded-xl bg-neutral-50 border border-neutral-200 px-3 py-2 text-black outline-none focus:border-black transition-all">
                </div>

                <div>
                    <label class="block text-xs font-medium text-neutral-600 mb-1">Password</label>
                    <input type="password" name="password" placeholder="••••••••" required
                           class="w-full rounded-xl bg-neutral-50 border border-neutral-200 px-3 py-2 text-black outline-none focus:border-black transition-all">
                </div>
                
                <button type="submit" 
                        class="w-full rounded-xl bg-black text-white px-4 py-2 hover:bg-neutral-800 transition-colors font-semibold mt-2">
                    Create Account
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-neutral-500">
                Already have an account? 
                <a href="{{ url_for('login') }}" class="text-black font-medium hover:underline">Login here</a>
            </div>
        </div>
    </div>
</body>
</html>
